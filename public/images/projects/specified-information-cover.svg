<text x="64" y="360" fill="#94a3b8" font-size="22" font-family="Inter,Helvetica,Arial,sans-serif">A dozen hidden-code hypotheses, tested and ruled out —</text>
<text x="64" y="392" fill="#94a3b8" font-size="22" font-family="Inter,Helvetica,Arial,sans-serif">and the simple thing left standing.</text>
<text x="64" y="450" fill="#cbd5e1" font-size="15" font-family="Inter,Helvetica,Arial,sans-serif">what specifies the reproducible wiring &#8594;  contact geometry + developmental timing + a small transmitter bias</text>
