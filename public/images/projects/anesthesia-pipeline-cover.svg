  </g>

  <!-- Verdict footer -->
  <g transform="translate(50, 700)" font-family="ui-monospace, monospace" font-size="13">
    <text x="0" y="0" fill="#71717a" font-size="11" letter-spacing="0.1em">VERDICT (replaces v1 5/5 PASS)</text>
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="80" height="38" rx="4" fill="#d1fae5" stroke="#10b981"/>
      <text x="40" y="17" text-anchor="middle" fill="#065f46" font-weight="700" font-size="20">7</text>
      <text x="40" y="32" text-anchor="middle" fill="#065f46" font-size="9" letter-spacing="0.05em">VERIFIED</text>

      <rect x="90" y="0" width="100" height="38" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="140" y="17" text-anchor="middle" fill="#1e3a8a" font-weight="700" font-size="20">1</text>
      <text x="140" y="32" text-anchor="middle" fill="#1e3a8a" font-size="9" letter-spacing="0.05em">HOMOLOG</text>

      <rect x="200" y="0" width="130" height="38" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="265" y="17" text-anchor="middle" fill="#92400e" font-weight="700" font-size="20">5</text>
      <text x="265" y="32" text-anchor="middle" fill="#92400e" font-size="9" letter-spacing="0.05em">AWAITING WET-LAB</text>

      <rect x="340" y="0" width="120" height="38" rx="4" fill="#f4f4f5" stroke="#a1a1aa"/>
      <text x="400" y="17" text-anchor="middle" fill="#3f3f46" font-weight="700" font-size="20">3</text>
      <text x="400" y="32" text-anchor="middle" fill="#3f3f46" font-size="9" letter-spacing="0.05em">UNCALIBRATED</text>

      <rect x="470" y="0" width="120" height="38" rx="4" fill="#ffe4e6" stroke="#f43f5e"/>
      <text x="530" y="17" text-anchor="middle" fill="#9f1239" font-weight="700" font-size="20">2</text>
      <text x="530" y="32" text-anchor="middle" fill="#9f1239" font-size="9" letter-spacing="0.05em">BOUNDARY FAIL</text>
